<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <title>Бронирование номера - Сладкие сны</title>
</head>
<body class="container">
<header class="d-flex flex-wrap justify-content-center py-3">
    <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
        <span class="fs-4 mx-2 fw-medium">Сладкие сны</span>
    </a>
    <ul class="nav" id="nav"></ul>
</header>
<div id="alerts"></div>
<main>
    <div class="d-flex justify-content-between flex-wrap align-items-center">
        <h1>Бронирование номера</h1>
    </div>
    <p class="lead" id="room-info"></p>
    <form class="row g-3 my-2" id="booking-form" novalidate>
        <div class="col-md-4">
            <label for="validationCustom01" class="form-label">Имя</label>
            <input type="text" class="form-control" id="validationCustom01" name="first_name" maxlength="50" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-4">
            <label for="validationCustom02" class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="validationCustom02" name="last_name" maxlength="50" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-4">
            <label for="validationCustomPhone" class="form-label">Телефон</label>
            <input type="text" class="form-control" id="validationCustomPhone" name="phone" maxlength="16" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-6">
            <label for="validationCustom03" class="form-label">Почта</label>
            <input type="text" class="form-control" id="validationCustom03" name="email" maxlength="100" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-12">
            <div id="calendar" aria-label="Календарь бронирования"></div>
        </div>
        <div class="col-md-3">
            <label for="validationCustom04" class="form-label">Дата заезда</label>
            <input type="date" class="form-control" id="validationCustom04" name="check_in" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-3">
            <label for="validationCustom05" class="form-label">Дата выезда</label>
            <input type="date" class="form-control" id="validationCustom05" name="check_out" required>
            <div class="invalid-feedback"></div>
        </div>
        <div class="d-grid gap-2">
            <button class="btn btn-primary" type="submit">Отправить заявку</button>
        </div>
    </form>
</main>
<footer class="py-2 my-2">
    <ul class="nav justify-content-between align-items-center">
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">ул. г.Москва, ул. Ивовая, 48</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-body-secondary">Время работы: Пн-Пт, с 8:00-17:00</a></li>
        <li class="nav-item"><a href="tel:88005553535" class="nav-link text-body-secondary">тел. 8 (800) 555 - 35 - 35</a></li>
        <li class="nav-item"><a href="mailto:обращения@СладкиеСны.рф" class="nav-link text-body-secondary">Email: обращения@СладкиеСны.рф</a></li>
    </ul>
</footer>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/jquery-3.7.1.slim.min.js"></script>
<script src="js/jquery.inputmask.min.js"></script>
<script src="js/index.js"></script>
<script src="js/order.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
